name: Feature request
description: Suggest a capability, command, or agent integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the workflow that is awkward today, not the solution you have in mind.
      placeholder: My agents keep rediscovering the same deployment decision because it lives in one project only.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Docmancer to do
      description: A command, flag, integration, or behaviour change.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this affect
      multiple: true
      options:
        - CLI
        - MCP server
        - Local web app (`docmancer web`)
        - Agent skills and hooks
        - Documentation Library (`docmancer docs`)
        - Retrieval and indexing
        - Cloud sync
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing commands, other tools, or manual workarounds.
    validations:
      required: false
