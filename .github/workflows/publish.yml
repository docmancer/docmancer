name: Publish to PyPI

on:
  push:
    tags:
      # Glob (not regex): three-part semver tags like v0.1.1
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install package and build tools
        run: pip install -e ".[dev]" build twine "hatchling<1.27"

      - name: Build static localhost interface
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build

      - name: Stage localhost assets into the Python package
        run: python scripts/stage_web_assets.py

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "from docmancer._version import __version__; print(__version__)")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match docmancer._version ($PKG). Bump docmancer/_version.py before tagging."
            exit 1
          fi

      - name: Verify distribution manifests
        run: python -m docmancer package-check --json

      - name: Run tests
        run: pytest tests/ -v

      - name: Gate memory recall quality
        run: >-
          python -m docmancer memory eval
          --dataset tests/fixtures/memory-eval-sanitized-real.jsonl
          --gate

      - name: Build artifacts
        run: python -m build --no-isolation

      - name: Verify built wheel
        run: python scripts/verify_built_wheel.py --expected-version "${GITHUB_REF_NAME#v}"

      - name: Check artifacts
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-registry:
    # Lists the release on the official MCP Registry. The registry verifies
    # ownership against the published PyPI description, so this must run after
    # publish-pypi, never beside it.
    needs: publish-pypi
    runs-on: ubuntu-latest
    # Dedicated environment so MCP_PRIVATE_KEY is not a plain repo secret: that
    # key can publish anything under dev.docmancer/*. Restrict the environment
    # to v*.*.* tags.
    environment: mcp-registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate docmancer/distribution/server.json

      - name: Wait for PyPI metadata to propagate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/docmancer/${VERSION}/json" >/dev/null; then
              echo "PyPI is serving docmancer ${VERSION}"
              exit 0
            fi
            echo "waiting for PyPI (${attempt}/30)"
            sleep 10
          done
          echo "::error::PyPI did not surface docmancer ${VERSION} within 5 minutes"
          exit 1

      # DNS rather than HTTP proof: docmancer.dev redirects the apex to www and
      # the registry's well-known fetcher refuses to follow redirects, so the
      # HTTP method cannot reach the bare apex the dev.docmancer namespace needs.
      - name: Publish to MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns \
            --domain docmancer.dev \
            --algorithm ecdsap384 \
            --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish docmancer/distribution/server.json
