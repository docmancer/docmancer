name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  local-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install package
        run: pip install -e .
      - name: Build static localhost interface
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
      - name: Verify wheel asset staging
        run: |
          python scripts/stage_web_assets.py
          test -f docmancer/web/static/index.html

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Gate memory recall quality
        if: matrix.python-version == '3.11'
        run: >-
          python -m docmancer memory eval
          --dataset tests/fixtures/memory-eval-sanitized-real.jsonl
          --gate
