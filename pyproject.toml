[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "docmancer"
dynamic = ["version"]
# Canonical tagline. Keep byte-identical with README.md, wiki/Home.md,
# website/apps/web/app/layout.tsx metadata.description, and app/llms.txt/route.ts.
description = "Docmancer gives every coding agent on your machine one local memory, so you stop re-explaining your project to each of them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "ai",
    "ai-agents",
    "coding-agents",
    "agent-memory",
    "ai-memory",
    "memory",
    "claude-code",
    "codex",
    "cursor",
    "mcp",
    "llm",
    "rag",
    "retrieval",
    "context-engineering",
    "local-first",
    "cli",
    "documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "filelock>=3.0.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.13.0",
    "w3lib>=2.0.0",
    "ultimate-sitemap-parser>=0.12",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.0.0",
    "sqlite-vec>=0.1.0",
    "model2vec>=0.3.0",
    "charset-normalizer>=3.3.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "striprtf>=0.0.26",
    "pynacl>=1.6.2,<2.0.0",
    "keyring>=25.7.0,<26.0.0",
    "rfc8785>=0.1.4,<0.2.0",
    "starlette>=0.49.1,<2.0.0",
    "uvicorn>=0.30.0,<0.53.0",
    "mcp>=1.28.1,<2.0.0",
    "sse-starlette>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
crawl4ai = ["crawl4ai>=0.4.0"]
embeddings-heavy = ["fastembed>=0.4.0", "qdrant-client>=1.10.0"]
# The MCP SDK is a core dependency, so the packaged server works from a plain
# `pip install docmancer`. This extra is retained as a no-op alias so existing
# `pip install "docmancer[mcp]"` instructions keep resolving.
mcp = []
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastembed>=0.4.0",
    "qdrant-client>=1.10.0",
]
embeddings-voyage = ["voyageai>=0.2.0"]
embeddings-openai = ["openai>=1.0.0"]
embeddings-cohere = ["cohere>=5.0.0"]

[project.urls]
Homepage = "https://docmancer.dev"
Documentation = "https://docmancer.dev/docs/getting-started"
Repository = "https://github.com/docmancer/docmancer"
Changelog = "https://github.com/docmancer/docmancer/blob/main/CHANGELOG.md"
Issues = "https://github.com/docmancer/docmancer/issues"

[project.scripts]
"docmancer" = "docmancer.cli.__main__:cli"
"docmancer-mcp" = "docmancer.mcp.server:main"

[tool.hatch.version]
path = "docmancer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["docmancer"]

[tool.hatch.build]
artifacts = ["docmancer/web/static/**"]

# The default static embedding model is committed under docmancer/_models so
# release builds never depend on Hugging Face availability or rate limits.
# scripts/vendor_static_model.py is only for manual model refreshes.

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that load real models or hit the network (run locally after vendoring).",
]
