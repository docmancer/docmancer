[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "docmancer"
dynamic = ["version"]
description = "Compress local documentation context for coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "filelock>=3.0.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.13.0",
    "w3lib>=2.0.0",
    "ultimate-sitemap-parser>=0.12",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.0.0",
    "sqlite-vec>=0.1.0",
    "model2vec>=0.3.0",
    "charset-normalizer>=3.3.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "striprtf>=0.0.26",
    "mistralai>=1.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
crawl4ai = ["crawl4ai>=0.4.0"]
embeddings-heavy = ["fastembed>=0.4.0", "qdrant-client>=1.10.0"]
mcp = ["mcp>=1.0.0", "starlette>=0.40.0,<0.42.0", "sse-starlette>=1.6.1,<3.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastembed>=0.4.0",
    "qdrant-client>=1.10.0",
    "mcp>=1.0.0",
    "starlette>=0.40.0,<0.42.0",
    "sse-starlette>=1.6.1,<3.1.0",
]
embeddings-voyage = ["voyageai>=0.2.0"]
embeddings-openai = ["openai>=1.0.0"]
embeddings-cohere = ["cohere>=5.0.0"]

[project.scripts]
"docmancer" = "docmancer.cli.__main__:cli"
"docmancer-mcp" = "docmancer.mcp.server:main"

[tool.hatch.version]
path = "docmancer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["docmancer"]

# The default static embedding model is vendored into the package tree by
# scripts/vendor_static_model.py and must be present before building a release.
# Include it in both sdist and wheel so build-from-sdist produces the same
# offline default model as a direct wheel build.
[tool.hatch.build.targets.sdist.force-include]
"docmancer/_models" = "docmancer/_models"

[tool.hatch.build.targets.wheel.force-include]
"docmancer/_models" = "docmancer/_models"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that load real models or hit the network (run locally after vendoring).",
]
